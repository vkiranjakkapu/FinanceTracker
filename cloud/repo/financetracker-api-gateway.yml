platform:
  security:
    cors:
      enabled: true

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: financetracker-identity-service
              uri: lb://financetracker-identity-service
              predicates:
                - Path=/identity/**

            - id: financetracker-service
              uri: lb://financetracker-finance-service
              predicates:
                - Path=/finance/**
